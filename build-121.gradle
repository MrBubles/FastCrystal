plugins {
    // Build script for the 1.21.4 node only (see mapBuilds in settings.gradle).
    // Uses loom-remap with Yarn mappings. Sources live in src-121/ (frozen 1.21 code),
    // the shared src/ directory holds the unified 26.x code instead.
    id 'net.fabricmc.fabric-loom-remap' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = "${mod_version}+${project.name}"
group = "${maven_group}"

base {
    archivesName = "${archives_base_name}"
}

sourceSets {
    main {
        java.srcDirs = [rootProject.file('src-121/main/java')]
        resources.srcDirs = [rootProject.file('src-121/main/resources')]
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the versions/1.21.4/gradle.properties file
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def versionProperty = project.version
    inputs.property 'version', versionProperty

    filesMatching('fabric.mod.json') {
        expand version: versionProperty
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    def archivesNameProperty = project.base.archivesName
    inputs.property 'archivesName', archivesNameProperty
}

// configure the maven publication
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
